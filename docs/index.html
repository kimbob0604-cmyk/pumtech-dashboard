 <p><span class="tg">[2:35 투자포인트 3: 글로벌 고객]</span>로레알이 작년 스틱에 이어 올해 콤팩트를 주문했고, 4분기에 첫 출고가 나갑니다. 글로벌 브랜드는 한 용기를 그룹 안 여러 브랜드가 같이 쓰기 때문에 리오더가 나오면 물량이 큽니다. 지금 해외 고객 비중이 20%라 커질 여지가 큽니다.</p>
 <p><span class="tg">[3:05 밸류에이션]</span>지금 시총은 9,500억원입니다. 2028년 지배순이익 868억원에 증설기 평균 PER 15배를 주면 1조 3,000억원으로, 3,500억원이 더해집니다. 이익 정체기 배수 11배로 돌아가면 7,800억원으로 하방은 1,700억원이고, 위아래 비율은 약 2 대 1입니다. 2027년 순이익 컨센서스 741억원은 이미 제 추정을 넘어섰습니다.</p>
 <p><span class="tg">[3:40 이벤트]</span>앞으로 주가를 움직일 이벤트는 네 가지입니다. 첫째, 매월 나오는 화장품 수출 데이터로 물량 흐름을 확인합니다. 둘째, 4분기 실적에서 회사 가이던스인 매출 1,250억원 이상과 영업이익률 18%가 나오는지 봅니다. 셋째, 로레알 콤팩트 리오더가 나오면 글로벌 고객이 숫자로 바뀝니다. 넷째, 2028년 초 7공장 준공입니다. 반대로 영업이익률이 두 분기 연속 18%를 밑돌거나 7공장이 또 늦어지면 논리를 다시 봅니다.</p></div>`)}
